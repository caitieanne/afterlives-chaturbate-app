<!-- Broadcast Overlay "cryptid" HTML. Recommended size 480 x 360. Everything is drawn by the overlay's own script (no images, no outside files), console included. -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #stage { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  #pet { position: absolute; left: 50%; bottom: 30px; width: 256px; height: 256px; margin-left: -128px; image-rendering: pixelated; transition: filter 0.3s; }
  #bubble { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); max-width: 82%; padding: 8px 12px; border-radius: 10px; background: #f6ecdc; border: 3px solid #3b2a4f; color: #3b2a4f; font-size: 15px; line-height: 1.3; font-weight: bold; text-align: center; opacity: 0; transition: opacity 0.2s; }
  #bubble.show { opacity: 1; }
  #tag { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); padding: 3px 12px; border-radius: 9px; background: rgba(36, 22, 52, 0.8); border: 2px solid rgba(201, 182, 242, 0.75); color: #f1e8ff; font-size: 14px; font-weight: bold; white-space: nowrap; }
  #tag span { color: #c9a8f2; margin-left: 8px; letter-spacing: 1px; }
  #menu { position: absolute; left: 6px; bottom: 6px; padding: 6px 10px; border-radius: 9px; background: rgba(36, 22, 52, 0.84); border: 2px solid rgba(201, 182, 242, 0.75); color: #f1e8ff; font-size: 12px; font-weight: bold; display: none; }
  #menu h4 { margin: 0 0 3px; font-size: 11px; color: #c9a8f2; text-align: center; letter-spacing: 1px; }
  #menu div { display: flex; justify-content: space-between; gap: 12px; line-height: 1.5; }
  #menu b { color: #9be8c4; }
  .float { position: absolute; font-size: 26px; pointer-events: none; animation: rise 1.9s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(0) scale(0.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-130px) scale(1.25); } }
  .confetti { position: absolute; top: -10px; width: 8px; height: 12px; pointer-events: none; animation: fall 2.6s ease-in forwards; }
  @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(380px) rotate(520deg); opacity: 0.9; } }
</style>
<div id="stage">
  <canvas id="pet" width="64" height="64"></canvas>
  <div id="bubble"></div>
  <div id="menu"></div>
  <div id="tag"></div>
</div>
